# fly.toml app configuration file generated for gestormercado-openwa

app = "gestormercado-openwa"
primary_region = "gru"

[build]
  image = "ghcr.io/rmyndharis/openwa:latest"

[env]
  PORT = "2785"
  AUTHENTICATION_API_KEY = "mercadobot-secret-key-2026"
  CHROME_ARGS = "--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-gpu"

[http_service]
  internal_port = 2785
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1
